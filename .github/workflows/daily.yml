name: daily-update

on:
  schedule:
    - cron: '0 0 * * *'   # 每日 UTC 00:00 = 北京时间 08:00
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装 headless chromium（阿斯达克页面渲染用）
        run: npx -y playwright@latest install chromium-headless-shell --with-deps
        continue-on-error: true

      - name: 拉取上次发布数据（腾讯文档失败时的降级基底）
        run: |
          mkdir -p deploy
          curl -sf "https://chenm8108-a11y.github.io/strategy-dashboard/dashboard_data.json" \
            -o deploy/dashboard_data.json \
            && echo "已获取历史数据" || echo "无历史数据（首次运行或 Pages 未就绪）"
        continue-on-error: true

      - name: 运行看板更新（腾讯文档 + 东财 + 阿斯达克）
        env:
          TDOC_OAUTH_ACCESS_TOKEN: ${{ secrets.TDOC_OAUTH_ACCESS_TOKEN }}
        run: python update_dashboard.py

      - name: 发布到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          commit_message: "chore: daily dashboard update ${{ github.run_number }}"
